<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QualiTrack: centro de control de aseguramiento de la calidad de software" />
    <meta name="color-scheme" content="light dark" />
    <title>QualiTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bea'/%3E%3Ccircle cx='15' cy='15' r='7.4' fill='none' stroke='%23fff' stroke-width='2.8'/%3E%3Cpath d='M20 20l4.6 4.6' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='m11.8 15.1 2.3 2.3 4.2-4.4' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar, para que no parpadee (ver src/lib/theme.ts).
      try {
        var t = localStorage.getItem('qualitrack.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
