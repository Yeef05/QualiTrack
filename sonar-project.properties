# Configurar en SonarCloud: organización y clave del proyecto del equipo.
sonar.organization=CAMBIAR-organizacion
sonar.projectKey=CAMBIAR-organizacion_qualitrack
sonar.projectName=QualiTrack
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/test,apps/web/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.sourceEncoding=UTF-8
