# Integración continua de QualiTrack (Plan SQA, sección 5).
# Ningún cambio llega a main si falla alguno de estos pasos.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint, complejidad <= 10)
        run: npm run lint

      - name: Revisión de tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas con cobertura (meta >= 70 %)
        run: npm run test:coverage

      - name: Build del frontend
        run: npm run build

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            apps/api/coverage
            apps/web/coverage

      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
